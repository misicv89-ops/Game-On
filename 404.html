<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stranica nije pronađena – Game On</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/Game-On/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Outfit:wght@600;800;900&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#1A0B2E;color:#fff;font-family:'Outfit',system-ui,sans-serif;text-align:center}
.box{max-width:560px}
.logo{height:96px;aspect-ratio:1.63;margin:0 auto 28px;border-radius:14px;border:2px solid #FF2A85;overflow:hidden;background:#111}
.logo img{width:100%;height:100%;object-fit:cover;object-position:50% 53%;transform:scale(1.12);display:block}
.code{font-family:'Fredoka',sans-serif;font-size:clamp(80px,20vw,140px);line-height:.9;color:#00E5FF;text-shadow:0 0 30px rgba(0,229,255,.5);margin:0}
h1{font-size:clamp(26px,5vw,36px);font-weight:900;margin:14px 0 10px}
p{color:#C9BEDB;font-size:18px;line-height:1.55;margin:0 0 30px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:14px 28px;border:2px solid #fff;border-radius:999px;background:#FF2A85;color:#fff;font-weight:800;font-size:17px;letter-spacing:.4px;text-decoration:none;box-shadow:4px 4px 0 #00E5FF}
a.btn:hover{background:#FFDF00;color:#1A0B2E}
a.btn:focus-visible{outline:3px solid #00E5FF;outline-offset:4px}
</style>
</head>
<body>
<main class="box">
  <div class="logo"><img src="/Game-On/assets/logo.webp" alt="Game On logo" width="157" height="96"></div>
  <p class="code">404</p>
  <h1>Game over – ova stranica ne postoji.</h1>
  <p>Možda je link pogrešan ili je stranica premeštena. Vratite se na početnu i nastavite igru.</p>
  <a class="btn" href="/Game-On/">VRATI SE NA POČETNU</a>
</main>
</body>
</html>
